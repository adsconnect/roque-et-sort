    const hd=me?`<div class="hd"><img class="av" src="${PORTRAIT(P.champ)}" style="--b:${C.light}"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><div class="nm">${esc(P.name)}</div><div class="cl">${C.n} · ${C.cls}</div></div>
        <button class="emobtn purple" data-act="gWheel" style="opacity:${GS.emoCd?.45:1}">${ICON.smile}</button></div>`
      :`<div class="hd">${!P2?`<button class="round" style="width:48px;height:48px;align-self:flex-start" data-act="gMuteOpp" title="Couper les emotes de l'adversaire">${GS.muteOpp?ICON.chatoff:ICON.chat}</button>`:''}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;${P2?'':'align-items:flex-end'}"><div class="nm" style="${P2?'':'text-align:right'}">${esc(P.name)}</div><div class="cl">${C.n} · ${C.cls}</div></div><img class="av" src="${PORTRAIT(P.champ)}" style="--b:${C.light};${P2?'order:-1':''}"></div>`;
    const king=`<div style="display:flex;flex-direction:column;gap:6px"><div class="hpline"><span style="display:flex;align-items:center;gap:8px"><img src="${tokOf(P.champ,'R')}" style="width:28px;height:28px;filter:${tokFilter(P.champ)}">PV du roi</span><b style="font-size:22px">${k.hp} / ${k.max}</b></div>
       <div class="kbar"><i style="width:${kp}%;background:${me?'linear-gradient(180deg,#C9A7F0,#7A3FB8)':'linear-gradient(180deg,#FF8196,#B3122E)'}"></i></div></div>`;
    const mana=`<div style="display:flex;flex-direction:column;gap:8px"><div class="hpline"><span>Mana</span><b style="font-size:22px;color:#D9C4F5">${P.mana} / ${P.maxMana}</b></div><div class="crys">${crystals(P,act&&G.pl[s].mana===G.pl[s].maxMana)}</div></div>`;
    const coups=act?`<div class="coups"><span>Coups restants</span><b>${P.movesLeft}</b></div>`:'';
    const endb=me?`<button class="b3d blue endturn ${myTurn()&&!G.chain&&!G.pending&&!P.heroPick?'':'off'}" data-act="gEnd">Fin du tour</button>`:'';
    el.innerHTML=P2?`${hd}<div class="mid">${king}${mana}</div>${me?endb:''}`:`${hd}${king}${mana}${me?coups+endb:coups}`;
  });
}
function renderSpells(){
  const G=GS.G, box=$('gSpells'); if(!G||!box) return; const s=GS.me; const P=G.pl[s], ch=P.champ, C=E.CHAMPS[ch];
  const pas=`<div class="spc" title="${esc(C.passive.d)}"><div style="display:flex;align-items:center;gap:8px"><div class="ic" style="background:radial-gradient(circle at 50% 35%,${C.col},#1E1330)"><img src="${PASSIVE_ICON[ch]||'assets/sort.svg'}"></div><span class="pt">PASSIF</span></div><div class="n">${esc(C.passive.n)}</div><div class="d">${esc(C.passive.d)}</div></div>`;
  const sp=['a','b','u'].map(k=>{ const S=C.spells[k]; const u=myTurn()?E.spellUsable(G,s,k):{ok:false}; const armed=GS.armed&&GS.armed.k==='spell'&&GS.armed.s===k; const used=k==='u'&&P.ult;
    return `<button class="spc ${armed?'armed':u.ok?'can':'off'}" data-act="gSpell" data-s="${k}" title="${esc(S.d)}"><div class="ic" style="background:${k==='u'?'radial-gradient(circle at 50% 35%,#8C0C22,#2A0A14)':`radial-gradient(circle at 50% 35%,${C.col},#1E1330)`}"><img src="${spellIcon(ch,k)}"></div>
      <div class="n">${esc(S.n)}</div><div class="d">${used?'Déjà utilisé cette partie.':esc(S.d)}</div><div class="cg"><div class="gem">${S.cost}</div></div></button>`; }).join('');
  box.innerHTML=pas+sp;
}
function renderTurn(){
  const G=GS.G, el=$('gTurn'); if(!G||!el) return; const P=G.pl[G.turn];
  $('gRoundN').textContent='TOUR '+G.round;
  let txt, bg;
  if(G.winner!=null){ txt='Partie terminée'; bg='#283140'; }
  else if(G.turn===GS.me){ bg='linear-gradient(180deg,#6E36A0,#4B1E6B)';
    const cps=P.movesLeft>1?`${P.movesLeft} coups`:P.movesLeft===1?'1 coup':'0 coup';
    if(P.heroPick) txt='Choisis 2 pions héros'; else if(G.pending) txt=G.pending.kind==='portal'?'Portail · choisis la destination':'Inversion · choisis 2 ennemis'; else if(G.chain) txt='Réattaque possible';
    else if(GS.armed){ const n=GS.armed.k==='spell'?E.CHAMPS[P.champ].spells[GS.armed.s].n:GS.armed.k==='kab'?E.CHAMPS[P.champ].king[GS.armed.i].n:'Roque'; txt=`${n} · choisis une cible`; }
    else txt=`À toi · ${cps}`; }
  else { bg='linear-gradient(180deg,#D0253F,#8C0C22)'; txt=`Tour de ${P.name}`; }
  el.style.background=bg; el.textContent=txt;
  const chn=$('gChain');
  if(myTurn()&&(G.chain||(G.pending&&G.pending.kind!=='portal'))){ chn.style.display='flex';
    chn.innerHTML=G.chain?`<span>${G.chain.kind==='ult'?`Réattaque ×${G.chain.mult.toFixed(1).replace('.',',')} · saut de cavalier · ${G.chain.left} restante(s)`:G.chain.kind==='clan'?'Traque du clan · réattaque une cible qui saigne':'Soif de sang · réattaque'}</span><button data-act="gChainEnd">Terminer</button>`
      :`<span>Inversion · choisis 2 ennemis à échanger</span><button data-act="gPendSkip">Passer</button>`; }
  else chn.style.display='none';
}
const EVI={spell:['assets/sort.svg','#35204F'],kill:['assets/skull.svg','#6E0F22'],bleed:['assets/goutte.svg','#4A0F1C'],camo:['assets/brume.svg','#35204F'],dmg:['assets/coup.svg','#283140'],
  heal:['assets/sort.svg','#1E3A2A'],shield:['assets/sort.svg','#28384F'],wall:['assets/coup.svg','#4A3A26'],st:['assets/sort.svg','#283F4A'],prot:['assets/sort.svg','#1E3A2A']};
function renderLog(){
  const G=GS.G, box=$('gLogList'); if(!G||!box) return;
  const items=G.log.slice(-60); const n=G.log.filter(e=>e.n).length; $('gLogN').innerHTML=`${n} actions${UI.orient==='L'?`<span style="transform:rotate(${GS.logOpen?180:0}deg);transition:transform .3s;display:inline-flex">${ICON.chev}</span>`:''}`;
  if(!GS.logOpen&&UI.orient==='L'){ return; }
  box.innerHTML=items.length?items.map((e,i)=>{ const last=i===items.length-1; const pl=e.side===GS.me;
    return `<div class="lg" style="background:${last?(pl?'rgba(107,62,160,.35)':'rgba(179,18,46,.3)'):(pl?'rgba(75,30,107,.16)':'rgba(179,18,46,.1)')};box-shadow:inset 0 0 0 2px ${last?'#E3C98A':'transparent'}">
     <div class="l1"><span class="num" style="background:${pl?'#B48AE8':'#FF6B81'}">${e.n||'•'}</span>${e.t?`<img src="${tokOf(e.champ,e.t)}" style="filter:${tokFilter(e.champ)}">`:''}<span style="color:${pl?'#E2D2F7':'#F9C6CF'}">${esc(e.text)}</span></div>
     ${e.ev.length?`<div class="evs">${e.ev.map(x=>`<span style="background:${(EVI[x.k]||EVI.spell)[1]}"><img src="${(EVI[x.k]||EVI.spell)[0]}">${esc(x.t)}</span>`).join('')}</div>`:''}</div>`; }).join('')
    :'<div style="padding:14px 8px;font-size:16px;font-weight:700;color:#8593A5">Les actions apparaîtront ici.</div>';
  box.scrollTop=box.scrollHeight;
}

/* ---- fin de partie ---- */
function showEnd(){
  const G=GS.G; if(!G) return; const ov=$('endOv'); if(!ov) return;
  const win=G.winner===GS.me; GS.won=win; const ch=G.pl[GS.me].champ, C=E.CHAMPS[ch];
  let earned=win?30:5; if(GS.mode==='campaign'&&win){ earned=50; if(FLOW.boss===PROF.camp) PROF.camp=Math.min(10,PROF.camp+1); }
  if(!GS.paid){ GS.paid=true; PROF.frag+=earned; saveProf(); }
  sfx(win?'win':'lose'); const url=voiceFile(ch,win?'win':'lose'); playVoice(url);
  const big=BIGART(ch); const line=lineText(ch,win?'win':'lose')||'';
  const nextLbl=GS.mode==='online'?'Revanche':GS.mode==='campaign'&&win&&FLOW.boss<9?'Boss suivant':'Rejouer';
  ov.innerHTML=`<div style="position:absolute;inset:0;background:${win?'radial-gradient(ellipse 50% 60% at 30% 50%, rgba(227,201,138,.18), transparent 70%)':'radial-gradient(ellipse 50% 60% at 30% 50%, rgba(179,18,46,.2), transparent 70%)'}"></div>
   ${big?`<img class="art" src="${big}" style="transform:scaleX(-1);filter:${win?'drop-shadow(0 30px 40px rgba(0,0,0,.6))':'grayscale(.55) brightness(.7) drop-shadow(0 30px 40px rgba(0,0,0,.6))'}">`:`<img class="art pt" src="${PORTRAIT(ch)}" style="--b:${C.light};${win?'':'filter:grayscale(.55) brightness(.7)'}">`}
   <div class="col"><div class="eyebrow" style="font-size:20px;color:#9FAABB">FIN DE PARTIE · ${E.MAPS[G.map].name.toUpperCase()}${G.resigned?' · ABANDON':''}</div>
    <div class="ttl" style="color:${win?'#F0DDA6':'#FF4D68'};text-shadow:0 10px 0 #07090C,0 0 60px ${win?'rgba(227,201,138,.6)':'rgba(179,18,46,.8)'}">${win?'Victoire':'Défaite'}</div>
    ${line?`<div class="q">« ${esc(line)} »</div>`:''}
    <div class="rw"><div class="ri" id="rwIco"><img src="assets/fragment.svg" style="width:56px;height:56px"></div><div style="display:flex;flex-direction:column"><span class="lil" style="font-size:60px;line-height:1;color:#F0DDA6;text-shadow:0 4px 0 #07090C">+${earned}</span><span style="font-size:20px;font-weight:800;color:#C9B78A">Fragments de couronne · total ${PROF.frag}</span></div></div>
    <div class="btns"><button class="b3d blue" data-act="gReplay">${nextLbl}</button><button class="b3d dark" data-act="gMenu">Menu</button><button class="b3d dark" data-act="gSeeBoard" style="font-size:30px">Voir le plateau</button></div></div>`;
  ov.style.display='block';
}
GACT.gSeeBoard=()=>{ $('endOv').style.display='none'; const t=$('gTurn'); if(t){ t.textContent='Partie terminée · touche ici'; t.style.cursor='pointer'; t.onclick=()=>{ t.onclick=null; showEnd(); }; } };

/* ================= en ligne : relais MQTT ================= */
const NET={phase:'idle',client:null,code:null,host:false,rev:0,started:false,wait:null,prefill:null,peerName:null,peerChamp:null,rematch:false};
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const TOPIC='roqueetsort/v2/';
function loadMqtt(){ return new Promise((res,rej)=>{ if(window.mqtt) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<5;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function netLink(code){ return location.origin+location.pathname+'#ami-'+code; }
function netConnect(code,role){ return new Promise((res,rej)=>{ const other=role==='h'?'g':'h', base=TOPIC+code+'/'; let i=0;
  const next=()=>{ if(i>=BROKERS.length) return rej({type:'network'}); const url=BROKERS[i++]; let done=false;
    const c=mqtt.connect(url,{clientId:'rs2_'+Math.random().toString(16).slice(2,12),connectTimeout:6000,reconnectPeriod:3000,keepalive:20,clean:true,will:{topic:base+other,payload:JSON.stringify({t:'bye'}),qos:1,retain:false}});
    const fail=()=>{ if(done) return; done=true; try{c.end(true);}catch(e){} next(); }; const tm=setTimeout(fail,7000); c.on('error',fail);
    c.once('connect',()=>{ if(done) return; clearTimeout(tm); done=true; c.removeListener('error',fail);
      c.subscribe(base+role,{qos:1},err=>{ if(err){ try{c.end(true);}catch(e){} return next(); } res({client:c,send:d=>{ try{ c.publish(base+other,JSON.stringify(d),{qos:1}); }catch(e){} }}); }); }); };
  next(); }); }
function netSend(d){ if(NET.send) NET.send(d); }
function netClose(){ try{ if(NET.client){ netSend({t:'bye'}); const c=NET.client; setTimeout(()=>{ try{c.end(true);}catch(e){} },300); } }catch(e){} clearTimeout(NET.wait); Object.assign(NET,{client:null,send:null,code:null,host:false,rev:0,started:false,phase:'idle'}); }
function netErr(e){ const k=e&&e.type; toast(k==='notfound'?'Personne n’a répondu à ce code : vérifie-le, ou demande à ton ami de recréer une partie.':k==='network'?'Impossible de joindre le service de connexion. Vérifie ta connexion internet.':'La connexion a échoué, réessaie.',4000); netClose(); if(UI.screen==='lobby') render(); }
async function netHost(){ sfx('click'); try{ await loadMqtt(); }catch(e){ return toast('Impossible de charger le module de connexion.'); }
  netClose(); NET.phase='busy'; NET.msg='Création de la partie…'; render(); const code=genCode(); NET.code=code; NET.host=true;
  try{ const r=await netConnect(code,'h'); NET.client=r.client; NET.send=r.send; netListen(); NET.phase='wait'; if(UI.screen==='lobby') render(); }catch(e){ netErr(e); } }
async function netJoin(code){ code=String(code||'').trim().toUpperCase(); if(!/^[A-Z0-9]{5}$/.test(code)) return toast('Le code fait 5 caractères'); sfx('click');
  try{ await loadMqtt(); }catch(e){ return toast('Impossible de charger le module de connexion.'); }
  netClose(); NET.phase='busy'; NET.msg=`Connexion à la partie ${code}…`; NET.code=code; NET.host=false; render();
  try{ const r=await netConnect(code,'g'); NET.client=r.client; NET.send=r.send; netListen(); netSend({t:'hello',name:PROF.pseudo,champ:FLOW.champ});
    NET.wait=setTimeout(()=>{ if(!NET.started) netErr({type:'notfound'}); },12000); }catch(e){ netErr(e); } }
async function netShare(){ const link=netLink(NET.code), text=`Viens jouer à Roque & Sort avec moi ! Code : ${NET.code}`;
  if(navigator.share){ try{ await navigator.share({title:'Roque & Sort',text,url:link}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(link); toast('Lien copié'); }catch(e){ toast('Copie impossible : note le code '+NET.code); } }
function lobbyAfter(){ const i=$('joinCode'); if(i) i.addEventListener('keydown',e=>{ if(e.key==='Enter') netJoin(i.value); }); }
function netHostStart(){
  const map=Math.floor(Math.random()*5), starter=Math.random()<.5?0:1;
  const G=E.newGame({champs:[FLOW.champ,NET.peerChamp],map,starter,names:[PROF.pseudo,NET.peerName]});
  NET.rev=1; NET.started=true; GS.mode='online'; GS.me=0; GS.G=G; GS.paid=false; netSend({t:'start',G,rev:NET.rev}); startIntro();
}
function netListen(){ const c=NET.client;
  c.on('message',(topic,buf)=>{ let d; try{ d=JSON.parse(String(buf)); }catch(e){ return; } if(!d||typeof d!=='object') return;
    if(d.t==='hello'&&NET.host){ NET.peerName=String(d.name||'Ami').slice(0,16); NET.peerChamp=E.CHAMPS[d.champ]&&isAvail(d.champ)?d.champ:'nyx';
      if(!NET.started) netHostStart(); else if(GS.G) netSend({t:'start',G:GS.G,rev:NET.rev,resume:true}); return; }
    if(d.t==='start'&&!NET.host){ clearTimeout(NET.wait); const resume=d.resume&&NET.started&&GS.G; NET.started=true; NET.rev=d.rev; GS.mode='online'; GS.me=1; GS.G=d.G; GS.paid=false;
      if(resume||d.resume){ UI.screen='game'; GS.intro=false; GS.ended=false; buildGame(); afterState(); } else startIntro(); return; }
    if(d.t==='state'){ if(!GS.G||d.rev<=NET.rev) return; NET.rev=d.rev; const before=GS.G.turn; GS.G=d.G; if(UI.screen==='game'){ playEvents(d.G.ev); renderGame(); afterState(before); } return; }
    if(d.t==='emote'){ showEmote(1-GS.me,d.k); return; }
    if(d.t==='rematch'&&NET.host){ netHostStart(); return; }
    if(d.t==='bye'){ if(GS.G&&GS.G.winner==null&&UI.screen==='game') toast('Ton ami s’est déconnecté',3000); return; }
  });
  c.on('offline',()=>{ if(UI.screen==='game') toast('Connexion perdue, reconnexion…'); });
  c.on('connect',()=>{ if(NET.started&&!NET.host) netSend({t:'hello',name:PROF.pseudo,champ:FLOW.champ}); });
}
function netPushState(){ NET.rev++; netSend({t:'state',G:GS.G,rev:NET.rev}); }
function netRematch(){ if(NET.host) netHostStart(); else { netSend({t:'rematch'}); toast('Demande envoyée à l’hôte…'); } }

/* ================= démarrage ================= */
function boot(){
  loadProf(); UI.fragShown=PROF.frag;
  $('stage').addEventListener('click',onClick);
  $('stage').addEventListener('mouseover',e=>{ const s=e.target.closest('[data-act="star"]'); if(s&&UI.screen==='ai'&&UI.hoverStar!==+s.dataset.i){ UI.hoverStar=+s.dataset.i; render(); } });
  $('stage').addEventListener('keydown',e=>{ if(e.key==='Enter'&&UI.dlg==='pseudo') dlgOk(); });
  window.addEventListener('resize',layout); layout();
  const m=(location.hash||'').match(/^#ami-([A-Za-z0-9]{5})$/); if(m){ NET.prefill=m[1].toUpperCase(); }
  if(location.hash==='#test-partie'){ PROF.pseudo=PROF.pseudo||'Testeur'; FLOW.champ='nyx'; FLOW.mode='ai'; FLOW.diff=3; UI.screen='home'; render(); startLocal(); return; }
  go('home');
  if(!PROF.pseudo) askPseudo(false);
  if(NET.prefill){ FLOW.mode='online'; FLOW.from='online'; FLOW.champ=null; go('select'); toast('Choisis ton champion pour rejoindre ton ami'); }
}

boot();
